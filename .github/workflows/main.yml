name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Space-separated test class names to run (empty runs the full suite)
        required: false
        default: ''

permissions:
  contents: read

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners
# GitHub Actions does not support Docker, PostgreSQL server on Windows, macOS :(

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  source-distribution-check:
    name: 'Source distribution (JDK 11)'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 50
      - name: Start PostgreSQL
        working-directory: docker/postgres-server
        # postgres:latest is now PG 18, which breaks the array-type-name tests; pin the release-era PG 14
        env:
          PGV: 14
          CREATE_REPLICAS: yes
        run: docker compose up -d && docker compose logs
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 11
          cache: gradle
      - uses: burrunan/gradle-cache-action@v1
        name: Prepare source distribution
        env:
          S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
          S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
        with:
          job-id: source-release-jdk11
          arguments: --scan --no-parallel --no-daemon sourceDistribution -Ppgjdbc.version=1.0 -Prelease
      - name: Compute test filter
        id: filter
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          gradle_args=""
          mvn_list=""
          for t in $TEST_FILTER; do
            gradle_args="$gradle_args --tests *$t"
            mvn_list="${mvn_list:+$mvn_list,}*$t"
          done
          if [ -n "$mvn_list" ]; then
            echo "gradle=:postgresql:test$gradle_args" >> $GITHUB_OUTPUT
            echo "mvn=-Dtest=$mvn_list -Dsurefire.failIfNoSpecifiedTests=false" >> $GITHUB_OUTPUT
          else
            echo "gradle=test" >> $GITHUB_OUTPUT
            echo "mvn=" >> $GITHUB_OUTPUT
          fi
      - name: Verify source distribution
        working-directory: pgjdbc/build/distributions
        run: |
          tar xzf postgresql-1.0-jdbc-src.tar.gz
          cd postgresql-1.0-jdbc-src
          mvn --batch-mode --fail-at-end --show-version verify ${{ steps.filter.outputs.mvn }}
      - name: Skipped test report
        if: ${{ always() }}
        run: python3 .github/seal-skip-report.py pgjdbc/build/distributions/postgresql-1.0-jdbc-src/target/surefire-reports
      - name: Attach heap dump if any
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pgjdbc-heapdump-source-distribution
          path: pgjdbc/build/distributions/postgresql-1.0-jdbc-src/target/surefire-reports/*.hprof

  matrix_prep:
    name: Matrix Preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      MATRIX_JOBS: 5
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 50
    - id: set-matrix
      run: |
        node .github/workflows/matrix.js

  build-test:
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    needs: matrix_prep
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix_prep.outputs.matrix)}}
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      TZ: ${{ matrix.tz }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 50
    - name: Start PostgreSQL PGV=${{ matrix.pg_version }} TZ=${{ matrix.server_tz }} XA=${{ matrix.xa }} SSL=${{ matrix.ssl }} SCRAM=${{ matrix.scram }} CREATE_REPLICAS=${{ matrix.replication }}
      working-directory: docker/postgres-server
      env:
        PGV: ${{ matrix.pg_version }}
        TZ: ${{ matrix.server_tz }}
        XA: ${{ matrix.xa }}
        SSL: ${{ matrix.ssl }}
        SCRAM: ${{ matrix.scram }}
        CREATE_REPLICAS: ${{ matrix.replication }}
      # The below run command is long, however, it is intentional, and it makes the output nicer in GitHub UI
      run: |
        echo 'Starting PostgreSQL via docker-compose down; PGV=${{ matrix.pg_version }} TZ=${{ matrix.server_tz }} XA=${{ matrix.xa }} SSL=${{ matrix.ssl }} SCRAM=${{ matrix.scram }} CREATE_REPLICAS=${{ matrix.replication }} docker-compose up'

        docker compose down -v --rmi local
        docker compose up -d
        docker compose logs
    - name: 'Get test node ARCH'
      run: echo "arch_name=$(uname -i)" >> $GITHUB_OUTPUT
      id: get_arch_name
    - name: Set up Java ${{ matrix.java_version }}, ${{ matrix.java_distribution }}
      if: ${{ steps.get_arch_name.outputs.arch_name != 'aarch64' }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java_version }}
        distribution: ${{ matrix.java_distribution }}
        architecture: x64
        cache: gradle
    - name: 'Setup JDK ${{ matrix.java_version }} on ARM64'
      if: ${{ steps.get_arch_name.outputs.arch_name == 'aarch64' }}
      uses: AdoptOpenJDK/install-jdk@v1
      with:
        impl: hotspot # or openj9
        version: ${{ matrix.java_version }}
        architecture: aarch64
    - name: Prepare local properties
      run: |
        # See https://github.com/actions/runner/issues/409
        cat <<EOF >ssltest.local.properties
        enable_ssl_tests=${{ matrix.ssl == 'yes' && 'true' || 'false' }}
        EOF
        cat <<EOF >build.local.properties
        preferQueryMode=${{ matrix.query_mode }}
        EOF

    - name: Compute test filter
      id: filter
      env:
        TEST_FILTER: ${{ inputs.test-filter }}
      run: |
        args=""
        for t in $TEST_FILTER; do args="$args --tests *$t"; done
        if [ -n "$args" ]; then
          echo "gradle=:postgresql:test$args" >> $GITHUB_OUTPUT
        else
          echo "gradle=test" >> $GITHUB_OUTPUT
        fi

    - uses: burrunan/gradle-cache-action@v1
      name: Test
      env:
        S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
        S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}
        _JAVA_OPTIONS: ${{ matrix.extraJvmArgs }}
      with:
        read-only: ${{ matrix.os == 'self-hosted' }}
        job-id: jdk${{ matrix.java_version }}
        arguments: --scan --no-parallel --no-daemon --no-build-cache jandex ${{ steps.filter.outputs.gradle }} ${{ matrix.extraGradleArgs }}
        properties: |
          includeTestTags=${{ matrix.includeTestTags }}
          testExtraJvmArgs=${{ matrix.testExtraJvmArgs }}
          s3.build.cache=false

    - name: 'Install krb5 for GSS tests'
      if: ${{ matrix.gss == 'yes' }}
      run: |
        # test-gss runs /usr/lib/postgresql/14/bin; ubuntu-latest no longer ships PG 14, so take it from PGDG
        sudo apt -y update
        sudo apt -y install curl ca-certificates lsb-release
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt -y update
        sudo apt -y install krb5-kdc krb5-admin-server libkrb5-dev postgresql-14
    - name: 'Update hosts for GSS tests'
      if: ${{ matrix.gss == 'yes' }}
      run: |
        sudo -- sh -c "echo 127.0.0.1 auth-test-localhost.postgresql.example.com localhost > /etc/hosts"
        cat /etc/hosts
    - uses: burrunan/gradle-cache-action@v1
      if: ${{ matrix.deploy_to_maven_local }}
      name: Deploy pgjdbc to mavenLocal
      with:
        read-only: ${{ matrix.os == 'self-hosted' }}
        job-id: jdk${{ matrix.java_version }}
        arguments: publishToMavenLocal -Ppgjdbc.version=1.0.0-dev-master -PskipJavadoc
    - name: Attach heap dump if any
      if: ${{ failure() && github.event_name == 'pull_request' }}
      uses: actions/upload-artifact@v4
      with:
        name: pgjdbc-heapdump
        path: pgjdbc/*.hprof
    - name: Test GSS
      if: ${{ matrix.gss == 'yes' }}
      run: |
        cd test-gss
        ./gradlew assemble
        ./gradlew run
      env:
        KRB5CCNAME: ${{ github.workspace }}/test-gss/tmp_check/krb5cc
        KRB5_CONFIG: ${{ github.workspace }}/test-gss/tmp_check/krb5.conf
        KRB5_KDC_PROFILE: ${{ github.workspace }}/test-gss/tmp_check/kdc.conf
    - name: Test anorm-sbt
      if: ${{ matrix.check_anorm_sbt == 'yes' }}
      run: |
        # mkdir -p $HOME/.sbt/launchers/0.13.12
        # curl -L -o $HOME/.sbt/launchers/0.13.12/sbt-launch.jar http://dl.bintray.com/typesafe/ivy-releases/org.scala-sbt/sbt-launch/0.13.12/sbt-launch.jar

        cd test-anorm-sbt
        sed -i "s/\"org.postgresql\" % \"postgresql\" % \"[^\"]*\"/\"org.postgresql\" % \"postgresql\" % \"1.0.0-dev-master-SNAPSHOT\"/" build.sbt
        sbt test

    - name: Cleanup Docker
      if: ${{ always() }}
      working-directory: docker/postgres-server
      run: |
        docker compose ps
        docker compose down -v --rmi local
    - name: Skipped test report
      if: ${{ always() }}
      run: python3 .github/seal-skip-report.py pgjdbc/build/test-results pgjdbc-osgi-test/build/test-results benchmarks/build/test-results

  package:
    name: 'Package release jars (JDK 8)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 50
    - name: 'Set up JDK 8'
      uses: actions/setup-java@v3
      with:
        distribution: zulu
        java-version: 8
        cache: gradle
    - name: Build release jars
      run: ./gradlew --no-daemon --no-build-cache -Prelease -Ps3.build.cache=false -PskipJavadoc :postgresql:osgiJar :postgresql:shadowJar
    - name: Collect release jars
      run: |
        mkdir -p seal-dist
        # The bnd osgiJar is published with an empty classifier; the shadowJar is the -all jar
        for f in pgjdbc/build/libs/postgresql-*-osgi.jar; do cp "$f" "seal-dist/$(basename "$f" -osgi.jar).jar"; done
        cp pgjdbc/build/libs/postgresql-*-all.jar seal-dist/
        ls -l seal-dist
    - uses: actions/upload-artifact@v4
      with:
        name: postgresql-jars
        path: seal-dist/postgresql-*.jar
        if-no-files-found: error
